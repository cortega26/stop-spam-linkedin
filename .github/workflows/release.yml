name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: Package extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Smoke check
        run: npm run smoke

      - name: Package extension
        run: npm run package

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: extension-zip
          path: dist/linkedin-spam-blocker-*.zip
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [package, chrome, firefox]
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: extension-zip
          path: dist

      - name: Create GitHub Release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Match the version TOKEN, not the whole line: headings carry a title
          # suffix ("## 2.0.0 - Your feed, your rules"). The previous exact-line
          # match silently produced empty notes for 2.0.0 and would have created a
          # release with no body. Verified by dry-running this awk locally.
          NOTES="$(awk -v v="$VERSION" '
            f && /^## / { exit }
            !f { n = split($0, a, " "); if (a[1] == "##" && a[2] == v) { f = 1; next } }
            f { print }
          ' RELEASE_NOTES.md)"
          if [ -z "$NOTES" ]; then
            echo "::error::No RELEASE_NOTES.md section found for version $VERSION"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "LinkedIn Feed Control $VERSION" \
            --notes "$NOTES"
        env:
          GH_TOKEN: ${{ github.token }}

  chrome:
    name: Submit to Chrome Web Store
    runs-on: ubuntu-latest
    needs: package

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: extension-zip
          path: dist

      - name: Submit to Chrome Web Store
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: npm run submit:chrome

  firefox:
    name: Submit to Mozilla Add-ons
    runs-on: ubuntu-latest
    needs: package

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: extension-zip
          path: dist

      - name: Submit to Mozilla Add-ons
        env:
          FIREFOX_API_KEY: ${{ secrets.FIREFOX_API_KEY }}
          FIREFOX_API_SECRET: ${{ secrets.FIREFOX_API_SECRET }}
        run: npm run submit:firefox
