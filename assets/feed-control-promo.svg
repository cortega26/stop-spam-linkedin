  <rect x="24" y="452" width="352" height="56" rx="12" fill="#125EC2"/>
  <text x="200" y="486" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="750">Customize my feed  →</text>
</g>
<text x="54" y="639" fill="#8FAFD3" font-family="system-ui,Arial,sans-serif" font-size="12">Original product illustration · Not a screenshot of the extension</text>
