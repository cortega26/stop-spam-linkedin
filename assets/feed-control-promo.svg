<svg xmlns="http://www.w3.org/2000/svg" width="920" height="680" viewBox="0 0 920 680" role="img" aria-labelledby="title desc">
<title id="title">Feed Control: your LinkedIn, your rules</title>
<desc id="desc">Original promotional illustration showing a calm feed-control interface, a muted post and privacy-first controls. Not a screenshot.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0C1429"/><stop offset=".56" stop-color="#143056"/><stop offset="1" stop-color="#102344"/></linearGradient>
  <linearGradient id="screen" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F2F7FF"/></linearGradient>
  <linearGradient id="card" x1="0" x2="1"><stop stop-color="#F0F6FF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="16"/><feOffset dy="12"/><feComponentTransfer><feFuncA type="linear" slope=".28"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="920" height="680" fill="url(#bg)"/>
<circle cx="770" cy="90" r="260" fill="#337AF1" opacity=".10"/>
<circle cx="765" cy="95" r="209" fill="none" stroke="#FFFFFF" stroke-opacity=".07" stroke-width="1.5"/>
<circle cx="760" cy="90" r="265" fill="none" stroke="#FFFFFF" stroke-opacity=".05" stroke-width="1.5"/>
<circle cx="140" cy="550" r="210" fill="#2DD4BF" opacity=".065"/>
<g transform="translate(54 63)">
