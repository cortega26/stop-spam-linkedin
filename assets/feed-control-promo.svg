  <path d="M18 25 L23 30 L32 20" fill="none" stroke="#A7FFDD" stroke-width="3" stroke-linecap="round"/>
  <text x="66" y="21" fill="#FFFFFF" font-family="system-ui,Arial,sans-serif" font-size="22" font-weight="750">Feed Control</text>
  <text x="67" y="41" fill="#9EC5F5" font-family="system-ui,Arial,sans-serif" font-size="11" letter-spacing="1.7">FOR LINKEDIN</text>
</g>
<g transform="translate(53 220)" font-family="system-ui,Arial,sans-serif">
  <text x="0" y="0" fill="#A9C5E7" font-size="14" font-weight="700" letter-spacing="2.1">YOUR FEED</text>
  <text x="0" y="64" fill="#FFFFFF" font-size="57" font-weight="760" letter-spacing="-2.6">Your rules.</text>
  <text x="0" y="126" fill="#FFFFFF" font-size="57" font-weight="760" letter-spacing="-2.6">Less noise.</text>
  <text x="0" y="181" fill="#B8CCEA" font-size="19">Hide posts. Mute authors.</text>
  <text x="0" y="207" fill="#B8CCEA" font-size="19">Keep the useful conversations.</text>
  <rect x="0" y="246" rx="12" width="245" height="44" fill="#0B705F" stroke="#36C5A9" stroke-opacity=".42"/>
  <circle cx="20" cy="268" r="5.5" fill="#5DF0C8"/>
  <text x="36" y="273" fill="#DDFCF3" font-size="13" font-weight="750">PRIVATE. LOCAL. REVERSIBLE.</text>
</g>
<g transform="translate(461 67)" filter="url(#shadow)" font-family="system-ui,Arial,sans-serif">
  <rect width="400" height="542" rx="25" fill="url(#screen)"/>
  <rect width="400" height="87" rx="25" fill="#182C4E"/>
  <rect y="64" width="400" height="25" fill="#182C4E"/>
  <circle cx="30" cy="32" r="12" fill="#2E7FDF"/>
  <path d="M30 24 L37 27 L37 34 Q36 40 30 43 Q24 40 23 34 L23 27 Z" fill="none" stroke="#FFF" stroke-width="1.8"/>
  <text x="53" y="38" fill="#FFFFFF" font-size="18" font-weight="750">Feed Control</text>
  <rect x="274" y="23" width="101" height="23" rx="6" fill="#245764" stroke="#438D88"/>
  <text x="324" y="39" fill="#B9FFF0" text-anchor="middle" font-size="10" letter-spacing="1" font-weight="700">LOCAL ONLY</text>
  <rect x="24" y="109" width="352" height="85" rx="13" fill="#F2F7FF" stroke="#D6E5F7"/>
  <text x="42" y="139" fill="#324E71" font-size="14" font-weight="700">Your feed is yours.</text>
  <text x="42" y="162" fill="#68819E" font-size="12">Keep control without changing LinkedIn.</text>
  <rect x="304" y="128" width="50" height="27" rx="14" fill="#2070DB"/>
  <circle cx="339" cy="142" r="10" fill="#FFFFFF"/>
  <text x="24" y="232" fill="#203750" font-size="16" font-weight="750">Quiet controls</text>
  <g transform="translate(24 248)">
    <rect width="352" height="66" rx="13" fill="#FFFFFF" stroke="#DDE7F3"/>
    <circle cx="24" cy="32" r="11" fill="#D9EAFE"/>
    <path d="M18 32 H30" stroke="#1B67C4" stroke-width="2.2" stroke-linecap="round"/>
    <text x="44" y="29" fill="#203750" font-size="13" font-weight="700">Hide promoted posts</text>
    <text x="44" y="47" fill="#72869D" font-size="11">Your choice, any time</text>
    <rect x="291" y="21" width="42" height="24" rx="12" fill="#C5D3E5"/>
    <circle cx="303" cy="33" r="9" fill="white"/>
  </g>
  <g transform="translate(24 330)">
    <rect width="352" height="94" rx="13" fill="url(#card)" stroke="#D4E5F8"/>
    <path d="M25 25 L36 14 L47 25" fill="none" stroke="#2B6BC3" stroke-width="2"/>
    <path d="M25 25 L47 25" stroke="#2B6BC3" stroke-width="2"/>
    <text x="59" y="27" fill="#294A71" font-size="14" font-weight="750">Hidden at your request</text>
    <text x="59" y="49" fill="#68819E" font-size="11">Nothing is removed from LinkedIn.</text>
    <rect x="59" y="60" width="82" height="25" rx="7" fill="#1A68CA"/>
    <text x="100" y="77" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">Show post</text>
